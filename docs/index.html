<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suivi reservations</title>
<style>
  :root {
    --bg: #f7f6f2;
    --card: #ffffff;
    --border: #e2e0d8;
    --text: #1c1b19;
    --muted: #6b6a63;
    --accent-0: #eef3fb;
    --accent-1: #c9dcf3;
    --accent-2: #9dbfe8;
    --accent-3: #6e9bd6;
    --accent-4: #3d74bf;
    --weekend: #f2ede4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  header { margin-bottom: 20px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .sub { font-size: 13px; color: var(--muted); }
  .section-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; margin: 0 0 8px; }
  .toolbar {
    display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap;
    margin: 4px 0 22px; background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; padding: 14px 16px;
  }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 11px; color: var(--muted); }
  select, input[type="date"] {
    padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--card); font-size: 13px; color: var(--text);
  }
  button.reset {
    padding: 7px 12px; border: 1px solid var(--border); border-radius: 6px;
    background: #fbfaf7; font-size: 13px; color: var(--text); cursor: pointer;
  }
  button.reset:hover { background: var(--weekend); }
  .legend { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); margin-left: auto; }
  .legend-swatch { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 8px; }
  .metric { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
  .metric .label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .metric .value { font-size: 22px; font-weight: 600; }
  .metrics-note { font-size: 12px; color: var(--muted); margin: 0 0 22px; }
  .grid-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; background: var(--card); }
  table { border-collapse: collapse; width: 100%; min-width: 900px; }
  th, td { border: 1px solid var(--border); padding: 0; vertical-align: top; }
  th { background: #fbfaf7; font-size: 12px; color: var(--muted); font-weight: 600; padding: 8px 6px; text-align: center; position: sticky; top: 0; }
  th.weekend, td.weekend { background: var(--weekend); }
  td.time-col { font-size: 12px; color: var(--muted); text-align: right; padding: 8px 8px; white-space: nowrap; background: #fbfaf7; position: sticky; left: 0; }
  .cell { min-height: 56px; padding: 6px 8px; font-size: 12px; }
  .cell.empty { color: #cbc9c0; text-align: center; padding: 16px 0; }
  .cell .cls { font-weight: 600; margin-bottom: 2px; }
  .cell .coach { color: var(--muted); margin-bottom: 4px; }
  .badge {
    display: inline-block; padding: 2px 6px; border-radius: 10px; font-size: 11px; font-weight: 600;
  }
  .empty-state { padding: 40px 20px; text-align: center; color: var(--muted); font-size: 13px; }
  footer { margin-top: 18px; font-size: 12px; color: var(--muted); }
  a { color: var(--accent-4); }
</style>
</head>
<body>

<header>
  <h1>Suivi reservations</h1>
  <div class="sub" id="snapshot-info">Chargement...</div>
</header>

<p class="section-label">KPIs globaux (sessions deja realisees)</p>
<div class="metrics" id="metrics"></div>
<p class="metrics-note" id="metrics-note"></p>

<p class="section-label">Planning</p>
<div class="toolbar">
  <div class="field">
    <label for="date-start">Du</label>
    <input type="date" id="date-start">
  </div>
  <div class="field">
    <label for="date-end">Au</label>
    <input type="date" id="date-end">
  </div>
  <div class="field">
    <label for="coach-filter">Coach</label>
    <select id="coach-filter">
      <option value="">Tous les coachs</option>
    </select>
  </div>
  <button class="reset" id="prev-week">&larr; Semaine precedente</button>
  <button class="reset" id="reset-week">Semaine en cours</button>
  <button class="reset" id="next-week">Semaine suivante &rarr;</button>
</div>

<div class="grid-wrap">
  <table id="timetable"><tbody></tbody></table>
</div>

<footer id="footer-note"></footer>

<script>
const JOURS = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
let ALL_SESSIONS = [];

function fillColor(booked, capacity) {
  if (capacity && booked >= capacity) return "var(--accent-4)";
  if (booked >= 3) return "var(--accent-3)";
  if (booked === 2) return "var(--accent-2)";
  if (booked === 1) return "var(--accent-1)";
  return "var(--accent-0)";
}

function textColor(booked, capacity) {
  return (capacity && booked >= capacity) || booked >= 3 ? "#fff" : "#1c1b19";
}

function isoDate(d) {
  return d.toISOString().slice(0, 10);
}

function currentWeekBounds() {
  const today = new Date();
  const jsToday = today.getDay(); // 0=Sun..6=Sat
  const diffToMonday = jsToday === 0 ? -6 : 1 - jsToday;
  const monday = new Date(today);
  monday.setDate(today.getDate() + diffToMonday);
  monday.setHours(12, 0, 0, 0);
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);
  return { start: isoDate(monday), end: isoDate(sunday) };
}

function nowAsLocalString() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

function renderKpis() {
  const nowIso = nowAsLocalString();
  const done = ALL_SESSIONS.filter(s => s.date_session < nowIso);

  const cap = done.reduce((a, s) => a + (s.capacite || 0), 0);
  const booked = done.reduce((a, s) => a + (s.places_reservees || 0), 0);
  const fillPct = cap ? Math.round((100 * booked / cap) * 10) / 10 : 0;

  document.getElementById('metrics').innerHTML = `
    <div class="metric"><div class="label">Sessions realisees</div><div class="value">${done.length}</div></div>
    <div class="metric"><div class="label">Places totales</div><div class="value">${cap}</div></div>
    <div class="metric"><div class="label">Places reservees</div><div class="value">${booked}</div></div>
    <div class="metric"><div class="label">Taux de remplissage reel</div><div class="value">${fillPct}%</div></div>
  `;
  document.getElementById('metrics-note').textContent =
    `Calcule sur les ${done.length} sessions deja passees (les sessions a venir ne sont pas encore completement reservees, elles fausseraient le taux).`;
}

function renderGrid() {
  const startVal = document.getElementById('date-start').value;
  const endVal = document.getElementById('date-end').value;
  const coachVal = document.getElementById('coach-filter').value;

  const table = document.getElementById('timetable');
  const footer = document.getElementById('footer-note');

  if (!startVal || !endVal || startVal > endVal) {
    table.innerHTML = '<tbody><tr><td class="empty-state">Choisissez une plage de dates valide.</td></tr></tbody>';
    footer.textContent = '';
    return;
  }

  const filtered = ALL_SESSIONS.filter(s => {
    const d = s.date_session.slice(0, 10);
    if (d < startVal || d > endVal) return false;
    if (coachVal && s.coach !== coachVal) return false;
    return true;
  });

  // build every calendar day in the selected range
  const days = [];
  const cursor = new Date(startVal + 'T12:00:00');
  const end = new Date(endVal + 'T12:00:00');
  while (cursor <= end) {
    days.push(isoDate(cursor));
    cursor.setDate(cursor.getDate() + 1);
  }

  if (!filtered.length) {
    table.innerHTML = '<tbody><tr><td class="empty-state">Aucune session sur cette periode / ce coach.</td></tr></tbody>';
    footer.textContent = `Periode affichee : ${startVal} au ${endVal}.`;
    return;
  }

  const times = [...new Set(filtered.map(s => s.heure))].sort();

  const byTimeDate = {};
  filtered.forEach(s => {
    const key = s.heure;
    byTimeDate[key] = byTimeDate[key] || {};
    byTimeDate[key][s.date_session.slice(0, 10)] = s;
  });

  let thead = '<tr><th></th>';
  days.forEach(d => {
    const jsDay = new Date(d + 'T12:00:00').getDay();
    const isWeekend = jsDay === 0 || jsDay === 6;
    const dayName = JOURS[jsDay === 0 ? 6 : jsDay - 1];
    thead += `<th class="${isWeekend ? 'weekend' : ''}">${dayName}<br>${d.slice(5)}</th>`;
  });
  thead += '</tr>';

  let rows = '';
  times.forEach(t => {
    rows += `<tr><td class="time-col">${t}</td>`;
    days.forEach(d => {
      const jsDay = new Date(d + 'T12:00:00').getDay();
      const isWeekend = jsDay === 0 || jsDay === 6;
      const s = (byTimeDate[t] || {})[d];
      if (!s) {
        rows += `<td class="${isWeekend ? 'weekend' : ''}"><div class="cell empty">-</div></td>`;
      } else {
        const bg = fillColor(s.places_reservees, s.capacite);
        const fg = textColor(s.places_reservees, s.capacite);
        rows += `<td class="${isWeekend ? 'weekend' : ''}">
          <div class="cell">
            <div class="cls">${s.nom_session}</div>
            <div class="coach">${s.coach || ''}</div>
            <span class="badge" style="background:${bg};color:${fg}">${s.places_reservees}/${s.capacite}</span>
          </div>
        </td>`;
      }
    });
    rows += '</tr>';
  });

  table.innerHTML = `<tbody>${thead}${rows}</tbody>`;
  footer.textContent = `Periode affichee : ${startVal} au ${endVal}.` +
    (coachVal ? ` Coach : ${coachVal}.` : '');
}

function shiftWeek(days) {
  const startEl = document.getElementById('date-start');
  const endEl = document.getElementById('date-end');
  const start = new Date((startEl.value || isoDate(new Date())) + 'T12:00:00');
  const end = new Date((endEl.value || isoDate(new Date())) + 'T12:00:00');
  start.setDate(start.getDate() + days);
  end.setDate(end.getDate() + days);
  startEl.value = isoDate(start);
  endEl.value = isoDate(end);
  renderGrid();
}

async function load() {
  const res = await fetch('data/latest.json', { cache: 'no-store' });
  const data = await res.json();
  ALL_SESSIONS = data.sessions || [];

  document.getElementById('snapshot-info').textContent =
    'Derniere mise a jour : ' + data.snapshot_time + ' (heure serveur, UTC)';

  renderKpis();

  const coaches = [...new Set(ALL_SESSIONS.map(s => s.coach).filter(Boolean))].sort();
  const filterEl = document.getElementById('coach-filter');
  coaches.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    filterEl.appendChild(opt);
  });

  const week = currentWeekBounds();
  document.getElementById('date-start').value = week.start;
  document.getElementById('date-end').value = week.end;

  document.getElementById('date-start').addEventListener('change', renderGrid);
  document.getElementById('date-end').addEventListener('change', renderGrid);
  filterEl.addEventListener('change', renderGrid);
  document.getElementById('reset-week').addEventListener('click', () => {
    const w = currentWeekBounds();
    document.getElementById('date-start').value = w.start;
    document.getElementById('date-end').value = w.end;
    filterEl.value = '';
    renderGrid();
  });
  document.getElementById('prev-week').addEventListener('click', () => shiftWeek(-7));
  document.getElementById('next-week').addEventListener('click', () => shiftWeek(7));

  renderGrid();
}

load().catch(err => {
  document.getElementById('snapshot-info').textContent = 'Erreur de chargement des donnees : ' + err.message;
});
</script>

</body>
</html>
